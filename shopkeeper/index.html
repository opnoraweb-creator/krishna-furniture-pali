<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shop Manager | Krishna Decor</title><link rel="stylesheet" href="css/style.css"></head>
<body><main class="wrap"><header><h1>Krishna Decor Furniture</h1><p>Shopkeeper Product Manager</p></header>
<section id="login" class="panel"><h2>Secure Shop Access</h2><p>Enter the private shop PIN provided by the website owner.</p><input id="pin" type="password" placeholder="Shop PIN"><button id="loginBtn">Continue</button><p id="loginMsg" class="msg"></p></section>
<section id="manager" hidden>
<div class="panel"><h2>Add Category</h2><input id="catName" placeholder="Category name (e.g. Sofa Set)"><input id="catImage" type="file" accept="image/*"><button id="addCat">Save Category</button></div>
<div class="panel"><h2>Add Product</h2><input id="productName" placeholder="Product name"><select id="productCategory"><option value="">Select category</option></select><textarea id="description" placeholder="Description (optional)"></textarea><input id="price" placeholder="Price (optional)"><input id="productImages" type="file" accept="image/*" multiple><button id="addProduct">Save Product</button></div>
<div class="panel"><h2>Existing Categories</h2><div id="categoryList"></div></div><div class="panel"><h2>Existing Products</h2><div id="productList"></div></div><p id="status" class="msg"></p>
</section></main><script src="js/app.js"></script></body></html>
